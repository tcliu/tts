<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>TTS</title>
    <script>
      // Apply the persisted theme before first paint to avoid a dark flash
      // for non-default-theme users; must stay in sync with use-settings.
      try {
        var stored = JSON.parse(localStorage.getItem('tts:web-settings') || '{}').theme
        if (stored === 'light' || stored === 'ember' || stored === 'sepia' || stored === 'nebula' || stored === 'sky') {
          document.documentElement.dataset.theme = stored
        }
      } catch {
        /* unreadable storage falls back to the default dark palette */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
